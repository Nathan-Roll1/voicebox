name: Fourier desktop microphone acceptance
on:
  push:
    branches: [qa/fourier-desktop-microphone]
permissions:
  contents: read
jobs:
  microphone:
    if: github.repository == 'Nathan-Roll1/voicebox'
    runs-on: windows-latest
    timeout-minutes: 28
    env:
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '110'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install CPU dependencies needed by the running app and test
        shell: bash
        run: |
          uv pip install --system torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system 'numpy<2' 'huggingface_hub<1' 'transformers==4.57.6' sherpa-onnx==2.0.2 'fastmcp>=3,<4' fastapi uvicorn sqlalchemy alembic python-multipart httpx soundfile librosa 'pedalboard<0.9.21' pillow sse-starlette pytest playwright psutil pywinauto
      - name: Install official desktop MSI and exercise the real recording controls
        shell: pwsh
        run: python .github/qa/voicebox-native-only.py
